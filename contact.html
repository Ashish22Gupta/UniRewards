<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - UniRewards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=celebration,check_circle,error,info,mail,phone,star,warning" rel="stylesheet">
    <link href="src/css/style.css" rel="stylesheet" />
    <style>.font-york { font-family: 'York Grot', 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f8f9fa]">
    <nav class="bg-gradient-to-r from-[#001E82] to-[#0c31AC] py-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <img src="./src/images/logo.png" alt="UniRewards" class="h-9 w-auto" />
                <span class="text-white font-bold text-lg font-york hidden md:inline">UniRewards</span>
            </a>
            <a href="index.html" class="text-white/80 hover:text-white text-sm"><i class="bi bi-house"></i> Home</a>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-12 max-w-4xl">
        <div class="text-center mb-10">
            <span class="material-symbols-outlined icon-xl text-gold">mail</span>
            <h1 class="text-3xl md:text-4xl font-bold text-[#001E82] font-york mt-2">Get in Touch</h1>
            <p class="text-gray-600 mt-2">We usually respond within 24 hours</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white rounded-xl p-5 border border-gray-100 shadow-sm text-center">
                <div class="w-12 h-12 rounded-full bg-[#001E82]/10 flex items-center justify-center mx-auto mb-3">
                    <span class="material-symbols-outlined text-primary">mail</span>
                </div>
                <h3 class="font-bold text-sm">Email</h3>
                <p class="text-xs text-gray-500 mt-1">support@unirewards.com</p>
            </div>
            <div class="bg-white rounded-xl p-5 border border-gray-100 shadow-sm text-center">
                <div class="w-12 h-12 rounded-full bg-[#EAA221]/10 flex items-center justify-center mx-auto mb-3">
                    <span class="material-symbols-outlined text-gold">phone</span>
                </div>
                <h3 class="font-bold text-sm">Phone</h3>
                <p class="text-xs text-gray-500 mt-1">+91 7709139927</p>
            </div>
            <div class="bg-white rounded-xl p-5 border border-gray-100 shadow-sm text-center">
                <div class="w-12 h-12 rounded-full bg-[#79B619]/10 flex items-center justify-center mx-auto mb-3">
                    <i class="bi bi-clock text-green text-2xl"></i>
                </div>
                <h3 class="font-bold text-sm">Hours</h3>
                <p class="text-xs text-gray-500 mt-1">Mon–Fri · 10am–6:30pm</p>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 md:p-8">
            <h2 class="text-xl font-bold text-[#001E82] font-york mb-4">Send us a message</h2>
            <form id="contactForm" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="floating-input">
                        <input type="text" id="cName" class="form-input w-full" placeholder=" " required>
                        <label for="cName" class="floating-label">Full Name *</label>
                    </div>
                    <div class="floating-input">
                        <input type="email" id="cEmail" class="form-input w-full" placeholder=" " required>
                        <label for="cEmail" class="floating-label">Email *</label>
                    </div>
                </div>
                <div>
                    <label class="form-label">Subject *</label>
                    <select class="form-select w-full" required>
                        <option value="" disabled selected>Select a topic</option>
                        <option>Account Issue</option>
                        <option>Reward / Payout Issue</option>
                        <option>KYC Verification</option>
                        <option>Bug Report</option>
                        <option>Partnership</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="floating-input">
                    <textarea id="cMsg" rows="5" class="form-input w-full resize-none" placeholder=" " required></textarea>
                    <label for="cMsg" class="floating-label">Your message *</label>
                </div>
                <button type="submit" class="btn-primary w-full py-3 rounded-lg font-bold">Send Message</button>
            </form>

            <div id="contactSuccess" class="hidden text-center p-6 bg-green-50 rounded-xl border-2 border-green-200 mt-4">
                <span class="material-symbols-outlined icon-xl text-green">check_circle</span>
                <h3 class="text-xl font-bold text-green-700 mt-2">Message Sent!</h3>
                <p class="text-gray-600 text-sm mt-1">We'll get back to you within 24 hours.</p>
            </div>
        </div>
    </main>

    <footer class="bg-[#212529] text-white py-8 mt-12">
        <div class="container mx-auto px-4 text-center text-sm text-gray-400">
            <p>&copy; 2026 UniRewards. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="src/js/script.js"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            this.classList.add('hidden');
            document.getElementById('contactSuccess').classList.remove('hidden');
            if (window.showToast) showToast('Message sent successfully!', 'success');
        });
    </script>
</body>
</html>
