<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAQ - UniRewards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=celebration,check_circle,error,expand_more,info,star,warning" rel="stylesheet">
    <link href="src/css/style.css" rel="stylesheet" />
    <style>.font-york { font-family: 'York Grot', 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f8f9fa]">
    <nav class="bg-gradient-to-r from-[#001E82] to-[#0c31AC] py-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <img src="./src/images/logo.png" alt="UniRewards" class="h-9 w-auto" />
                <span class="text-white font-bold text-lg font-york hidden md:inline">UniRewards</span>
            </a>
            <a href="index.html" class="text-white/80 hover:text-white text-sm"><i class="bi bi-house"></i> Home</a>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-12 max-w-3xl">
        <div class="text-center mb-10">
            <span class="material-symbols-outlined icon-xl text-gold">info</span>
            <h1 class="text-3xl md:text-4xl font-bold text-[#001E82] font-york mt-2">Frequently Asked Questions</h1>
            <p class="text-gray-600 mt-2">Everything you need to know about UniRewards</p>
        </div>

        <div class="space-y-3" id="faqList">
        </div>

        <div class="mt-12 text-center bg-white rounded-2xl p-8 border border-gray-100 shadow-sm">
            <h2 class="text-xl font-bold text-[#001E82] font-york">Still have questions?</h2>
            <p class="text-gray-600 mt-2">Our support team is happy to help.</p>
            <a href="contact.html" class="btn-primary inline-block mt-4 px-6 py-3 rounded-lg font-bold">Contact Us</a>
        </div>
    </main>

    <footer class="bg-[#212529] text-white py-8 mt-12">
        <div class="container mx-auto px-4 text-center text-sm text-gray-400">
            <p>&copy; 2026 UniRewards. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const faqs = [
            { q: 'What is UniRewards?', a: 'UniRewards is a gamified rewards platform where students earn points by completing challenges, then redeem them for real rewards like cashback, vouchers, and physical gifts.' },
            { q: 'How do I earn points?', a: 'You earn points by completing surveys, posting on social media about your experience, referring friends, and daily check-ins. Each challenge has its own points value.' },
            { q: 'Are the rewards real?', a: 'Absolutely. We partner with verified vendors and process cashback directly via UPI, Amazon Pay, or physical delivery for products.' },
            { q: 'How long does KYC take?', a: 'KYC verification usually completes within 24–48 hours of document submission. Once verified, you unlock all high-value rewards.' },
            { q: 'Why do I need to complete KYC?', a: 'KYC is required for regulatory compliance and to prevent fraud, especially for cash rewards above ₹500 or physical products.' },
            { q: 'How much can I earn per month?', a: 'Active users typically earn ₹500–₹2,500 per month. Top earners have earned over ₹5,000 in a single month.' },
            { q: 'When are points credited?', a: 'Points are credited instantly for surveys and check-ins, and within 24–72 hours for referrals and social media tasks (pending verification).' },
            { q: 'Can I transfer my points to a friend?', a: 'No, points are non-transferable. They are tied to your verified account for security.' },
            { q: 'What happens if my KYC is rejected?', a: 'You will be notified via email with the reason. You can re-upload clearer documents from the Profile page.' },
            { q: 'How do I delete my account?', a: 'Contact support@unirewards.com. Your data will be removed within 30 days per our Privacy Policy.' }
        ];

        const faqList = document.getElementById('faqList');
        faqs.forEach((item, i) => {
            const el = document.createElement('details');
            el.className = 'bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden group';
            el.innerHTML = `
                <summary class="flex items-center justify-between cursor-pointer p-5 font-semibold text-[#001E82] list-none">
                    <span class="flex items-center gap-3">
                        <span class="w-7 h-7 rounded-full bg-[#001E82]/10 text-[#001E82] text-sm flex items-center justify-center">${i + 1}</span>
                        ${item.q}
                    </span>
                    <span class="material-symbols-outlined icon-md text-[#EAA221] transition-transform group-open:rotate-180">expand_more</span>
                </summary>
                <div class="px-5 pb-5 text-gray-600 text-sm leading-relaxed">${item.a}</div>
            `;
            faqList.appendChild(el);
        });

        document.querySelectorAll('details').forEach(d => {
            d.addEventListener('toggle', () => {
                const content = d.querySelector('div');
                if (d.open) {
                    content.style.animation = 'fadeInUp 0.3s ease';
                }
            });
        });
    </script>
</body>
</html>
